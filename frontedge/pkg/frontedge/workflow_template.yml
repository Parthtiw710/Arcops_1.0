name: Deploy to Cloudflare Pages (Frontedge)

on:
  push:
    branches:
      - {{BRANCH}}
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: {{CD_CMD}}npm install

      - name: Build project
        run: {{CD_CMD}}{{BUILD_CMD}}

      - name: Publish to Cloudflare Pages via Wrangler CLI
        run: npx wrangler pages deploy {{OUTPUT_DIR}} --project-name="{{PROJECT_NAME}}" --branch="{{BRANCH}}" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
