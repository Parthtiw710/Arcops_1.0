version: '3.8'

# =============================================================================
# ArcOps 1.0 Unified Development & Production Docker Stack
# Strict Sequential Microservice Ports:
# Gateway: 8000 | ArcAuth: 8081 | DBMux: 8082 | BuckStream: 8083 | Frontedge: 8084 | Web: 3000
# =============================================================================

services:
  # 1. PostgreSQL Database with Vector extension (pgvector)
  postgres:
    image: pgvector/pgvector:pg17
    container_name: arcops-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arcops}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 3s
      timeout: 5s
      retries: 5
    restart: always

  # 2. Redis for PubSub, Caching, and Queueing
  redis:
    image: redis:7-alpine
    container_name: arcops-redis
    env_file:
      - .env
    ports:
      - "6379:6379"
    restart: always

  # 3. ArcAuth Single-User Auth Service (Port 8081)
  arcauth:
    build:
      context: ../arcauth
      dockerfile: Dockerfile
    container_name: arcops-arcauth
    env_file:
      - .env
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - DBMUX_URL=http://dbmux:8082
    depends_on:
      - dbmux
    restart: always

  # 4. DBMux OSS Data Engine (Port 8082)
  dbmux:
    build:
      context: ../dbmux
      dockerfile: Dockerfile
    container_name: arcops-dbmux
    env_file:
      - .env
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  # 5. BuckStream OSS S3 Object Storage Broker (Port 8083)
  buckstream:
    build:
      context: ../buckstream
      dockerfile: Dockerfile
    container_name: arcops-buckstream
    env_file:
      - .env
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
    volumes:
      - storage_data:/data/storage
    restart: always

  # 6. Frontedge Cloudflare Pages & GitHub Deployer Service (Port 8084)
  frontedge:
    build:
      context: ../frontedge
      dockerfile: Dockerfile
    container_name: arcops-frontedge
    env_file:
      - .env
    ports:
      - "8084:8084"
    environment:
      - PORT=8084
    restart: always

  # 7. ArcOps Central Single-User Gateway (Port 8000)
  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    container_name: arcops-gateway
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - GATEWAY_PORT=8000
      - ARCAUTH_URL=http://arcauth:8081
      - DBMUX_URL=http://dbmux:8082
      - BUCKSTREAM_URL=http://buckstream:8083
      - FRONTEDGE_URL=${FRONTEDGE_URL:-http://frontedge:8084}
      - WEB_URL=${WEB_URL:-http://web:80}
    depends_on:
      - arcauth
      - dbmux
      - buckstream
      - frontedge
    restart: always

  # 8. ArcOps Web Dashboard (Port 3000)
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: arcops-web
    env_file:
      - .env
    ports:
      - "3000:80"
    depends_on:
      - gateway
    restart: always

volumes:
  postgres_data:
  redis_data:
  storage_data:
